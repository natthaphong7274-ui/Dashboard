.hero-milestone {
  position: absolute; top: -4px; width: 2px; height: 18px;
  background: rgba(255,255,255,.4); border-radius: 1px; z-index: 2;
}
.hero-milestone-lbl {
  position: absolute; top: 18px; transform: translateX(-50%);
  font-size: 9px; color: rgba(255,255,255,.5); font-weight: 700; white-space: nowrap;
}
/* ── Shortcut buttons row ── */
.hero-shortcuts {
  display: flex; gap: 8px; flex-wrap: wrap;
}
.hero-sc-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 14px; border-radius: 9px; cursor: pointer;
  font-size: 12px; font-weight: 700; border: 1.5px solid transparent;
  transition: all .15s; white-space: nowrap; letter-spacing: .01em;
}
.hero-sc-primary {
  background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.3); color: white;
}
.hero-sc-primary:hover { background: rgba(255,255,255,.25); }
.hero-sc-risk {
  background: rgba(232,98,42,.22); border-color: rgba(232,98,42,.5); color: #fdba74;
}
.hero-sc-risk:hover { background: rgba(232,98,42,.32); }
.hero-sc-growth {
  background: rgba(22,163,74,.22); border-color: rgba(22,163,74,.45); color: #86efac;
}
.hero-sc-growth:hover { background: rgba(22,163,74,.32); }
.hero-sc-track {
  background: rgba(199,210,254,.12); border-color: rgba(199,210,254,.3); color: #c7d2fe;
}
.hero-sc-track:hover { background: rgba(199,210,254,.22); }
.home-kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}

@media(max-width:600px){.home-kpi-grid{grid-template-columns:1fr;}}

.home-op-panel{

.home-op-title{font-size:17px;font-weight:900;color:var(--ink);line-height:1.25;}
.home-op-desc{font-size:12px;color:var(--muted);margin-top:4px;max-width:72ch;}
.home-op-status{font-size:12px;font-weight:900;border-radius:999px;padding:6px 10px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);white-space:nowrap;}
.home-op-body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.9fr);gap:14px;align-items:start;}

.home-op-warn{border-color:#ffd993!important;background:var(--warn-bg)!important;color:var(--warn)!important;}
.home-op-danger{border-color:#ffc4bd!important;background:var(--bad-bg)!important;color:var(--bad)!important;}

#home_content .home-kcard{
  border-color:var(--line);
  box-shadow:var(--shadow-sm);

}
#home_content .home-kcard-lbl{font-size:11px;color:var(--muted);letter-spacing:.03em;}
#home_content .home-kcard-sub{font-size:11px;color:var(--muted);}

@media(max-width:1180px){.home-op-body{grid-template-columns:1fr}.home-op-metrics{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:680px){.home-op-head{flex-direction:column}.home-op-metrics,.home-op-actions{grid-template-columns:1fr}.home-op-status{white-space:normal}.home-op-title{font-size:16px;}}

/* 2-col layout: main + sidebar */
.home-layout { display: grid; grid-template-columns: 1fr 320px; gap: 12px; margin-bottom: 12px; }
.home-layout-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
@media (max-width: 1000px) { .home-layout { grid-template-columns: 1fr; } .home-layout-3 { grid-template-columns: 1fr 1fr; } }
/* home map+alert grid responsive */
#home_content [style*="grid-template-columns:1fr 360px"] { display: grid; }
@media (max-width: 1100px) { #home_content [style*="grid-template-columns:1fr 360px"] { grid-template-columns: 1fr !important; } }

/* Alert cards */
.home-alert-list { display: flex; flex-direction: column; gap: 6px; }
.home-alert-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 10px; cursor: pointer;
  border: 1px solid transparent; transition: .15s;
}
.home-alert-item:hover { filter: brightness(.97); }
.home-alert-inact   { background: #fff7ed; border-color: #fed7aa; }
.home-alert-drop    { background: #fef3c7; border-color: #fcd34d; }
.home-alert-ok      { background: #f0fdf4; border-color: #86efac; }
.home-alert-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.home-alert-text { flex: 1; font-size: 12px; font-weight: 600; }
.home-alert-count { font-size: 12px; font-weight: 800; }

/* Zone table */
.home-zone-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.home-zone-table th { padding: 7px 10px; background: #f0f4ff; color: var(--pr); font-weight: 700; text-align: left; border-bottom: 2px solid #dce9ff; font-size: 11px; }
.home-zone-table td { padding: 7px 10px; border-bottom: 1px solid #f0f4f8; }
.home-zone-table tr:hover td { background: #f8faff; }

/* Action items (BD) */
.home-action-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; border-radius: 10px; border: 1px solid #dce9ff;
  background: white; margin-bottom: 6px; cursor: pointer; transition: .15s;
}
.home-action-item:hover { border-color: var(--ac); background: #f8faff; }
.home-action-pri { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0; margin-top: 1px; }
.home-action-pri-high { background: #fee2e2; color: #991b1b; }
.home-action-pri-med  { background: #fef3c7; color: #92400e; }
.home-action-pri-low  { background: #dcfce7; color: #166534; }

/* Mini sparkline bar */
.home-mini-bar { display: flex; align-items: flex-end; gap: 2px; height: 28px; }
.home-mini-bar-col { flex: 1; border-radius: 2px 2px 0 0; min-width: 4px; transition: .2s; }

/* Progress ring */
.home-prog-ring { display: flex; align-items: center; gap: 8px; }
.home-prog-track { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; }

/* Quick action buttons */
.home-qbtn {
  padding: 8px 14px; border: 1.5px solid var(--bd); border-radius: 9px;
  background: white; font-size: 12px; font-weight: 700; color: var(--pr);
  cursor: pointer; transition: .15s; display: inline-flex; align-items: center; gap: 5px;
}
.home-qbtn:hover { border-color: var(--ac); background: #f0f9ff; color: var(--ac); }
.home-qbtn-primary { background: var(--pr); color: white; border-color: var(--pr); }
.home-qbtn-primary:hover { opacity: .88; color: white; }

/* ============================================================ */
.terr-kpi-card {
  background: var(--cd);
  border-radius: 14px;
  padding: 14px 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  border: 1px solid #dce9ff;
  position: relative;
  overflow: hidden;
}
.terr-kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--kc, var(--ac));
}
.terr-kpi-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--t2);
  margin-bottom: 4px;
}
.terr-kpi-value {
  font-size: 22px;
  font-weight: 800;
  color: var(--kc, var(--pr));
  line-height: 1;
  margin-bottom: 4px;
}
.terr-kpi-mom { font-size: 11px; font-weight: 700; }
.terr-zone-row {
  display: grid;
  grid-template-columns: 24px 1fr 80px 50px;
  gap: 4px;
  align-items: center;
  padding: 9px 8px;

  background: #f8fafc;
  border: 1px solid #eef2f8;

}
.terr-zone-row:hover { background: #eff4ff; border-color: var(--ac); }
.terr-zone-rank {

}
.terr-conv-bar { height: 4px; border-radius: 2px; background: #e2e8f0; margin-top: 3px; overflow: hidden; }
.terr-conv-fill { height: 100%; border-radius: 2px; background: var(--ac); }
@media (max-width: 900px) { #terr_main_row { grid-template-columns: 1fr !important; } }

/* Phase 10: compact workspace filter command bar */
.fpanel{
  display:grid;
  grid-template-columns:190px minmax(0,1fr);
  gap:14px;
  align-items:start;
  padding:12px 14px;
  margin-bottom:10px;
  background:#fbfcfd;
  border:1px solid #dbe6ee;
  border-radius:14px;
  box-shadow:0 1px 6px rgba(15,23,42,.06);
}
.fph{
  margin:0;
  min-height:58px;
  padding:10px 12px;
  border:1px solid #e2e8f0;
  border-radius:12px;
  background:#f8fafc;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
  gap:7px;
}

  font-size:12px;
  line-height:1.2;

  background:#e6fffb;
  border:1px solid #99f6e4;
  color:#0f766e;
  padding:4px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:950;
}
.frow{
  display:grid;
  grid-template-columns:minmax(250px,1.35fr) repeat(5,minmax(128px,.72fr)) minmax(150px,.8fr) auto;
  gap:8px;
  align-items:end;
}
.agent-srch-wrap,
.ms-wrap{
  min-width:0;
  max-width:none;
  width:100%;
}
.agent-srch-wrap label,
.ms-wrap label{
  min-height:14px;
  font-size:10px;
  color:#526a76;
  font-weight:900;
  text-transform:none;
  letter-spacing:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.agent-srch-input,
.ms-trigger{
  height:42px;
  border:1px solid #cfdce8;
  border-radius:10px;
  background:#fff;
  color:#172033;
  font-size:12px;
  box-shadow:0 1px 2px rgba(15,23,42,.03);
}
.agent-srch-input{
  padding:9px 12px;
}
.ms-trigger{
  padding:0 12px;
}
.agent-srch-input:focus,
.ms-trigger.open,
.ms-trigger:hover{
  border-color:#2f6fed;
  box-shadow:0 0 0 3px rgba(47,111,237,.11);
  background:#fff;
}
.ac-dropdown,
.ms-dropdown{
  top:calc(100% + 6px);
  border:1px solid #b8cbe2;
  border-radius:12px;
  box-shadow:0 14px 32px rgba(15,23,42,.16);
}
.factions{
  height:42px;
  padding-top:0;
  align-self:end;
  display:flex;
  gap:6px;
  align-items:center;
}
.btnf,
.btnc{
  height:42px;
  border-radius:10px;
  white-space:nowrap;
  font-weight:900;
}
.btnf{
  padding:0 15px;
  background:#172033;
  color:#fff;
}
.btnc{
  padding:0 12px;
  background:#fff;
  color:#64748b;
  border:1px solid #cfdce8;
}
.btnf:hover,
.btnc:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 18px rgba(15,23,42,.09);
}
@media(max-width:1350px){
  .fpanel{grid-template-columns:1fr;}
  .fph{min-height:auto;flex-direction:row;align-items:center;justify-content:space-between;}
  .frow{grid-template-columns:minmax(240px,1.2fr) repeat(3,minmax(130px,1fr)) auto;}
}
@media(max-width:900px){
  .frow{grid-template-columns:1fr 1fr;}
  .agent-srch-wrap{grid-column:1/-1;}
  .factions{grid-column:1/-1;justify-content:flex-start;}
}
@media(max-width:620px){
  .frow{grid-template-columns:1fr;}
  .factions{height:auto;flex-wrap:wrap;}
  .btnf,.btnc{flex:1;}
}

.parcel-stage{
  position:absolute;
  inset:0;
  perspective:900px;
  transform-style:preserve-3d;
  overflow:hidden;
  background:
    linear-gradient(180deg,rgba(11,24,34,.12),rgba(11,24,34,.62)),
    repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 1px,transparent 1px 110px),
    repeating-linear-gradient(180deg,rgba(255,255,255,.032) 0 1px,transparent 1px 110px);
}
.parcel-stage::before{
  content:'';
  position:absolute;
  left:7%;
  right:4%;
  bottom:7%;
  height:44%;
  transform:rotateX(64deg) rotateZ(-2deg);
  transform-origin:50% 100%;
  border:1px solid rgba(79,209,197,.12);
  background:
    repeating-linear-gradient(90deg,rgba(79,209,197,.16) 0 1px,transparent 1px 54px),
    repeating-linear-gradient(0deg,rgba(79,209,197,.12) 0 1px,transparent 1px 54px),
    linear-gradient(180deg,rgba(15,118,110,.05),rgba(15,118,110,.18));
  box-shadow:0 30px 80px rgba(0,0,0,.22);
}
.parcel-stage::after{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 58% 34%,rgba(79,209,197,.20),transparent 18%);
  pointer-events:none;
}
.parcel-belt{
  position:absolute;
  left:16%;
  right:12%;
  height:34px;
  bottom:25%;
  border-radius:999px;
  background:
    linear-gradient(90deg,transparent,rgba(45,212,191,.32),rgba(56,189,248,.18),transparent),
    repeating-linear-gradient(90deg,rgba(94,234,212,.16) 0 38px,rgba(94,234,212,.05) 38px 48px),
    linear-gradient(90deg,rgba(20,48,62,.84),rgba(36,76,92,.90));
  border:1px solid rgba(158,188,198,.18);
  transform:rotateX(62deg) rotateZ(-9deg);
  box-shadow:0 18px 36px rgba(0,0,0,.20),0 0 22px rgba(45,212,191,.10);
}
.belt-b{bottom:35%;left:22%;right:16%;transform:rotateX(62deg) rotateZ(7deg);}
.belt-c{bottom:45%;left:30%;right:19%;transform:rotateX(62deg) rotateZ(-4deg);}
.parcel-scanner{
  position:absolute;
  left:58%;
  bottom:44%;
  width:72px;
  height:58px;
  border-radius:10px 10px 4px 4px;
  background:linear-gradient(180deg,#244757,#12303f);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 36px rgba(0,0,0,.24);
  transform:rotateX(18deg) rotateZ(-4deg);
}
.parcel-scanner::after{
  content:'';
  position:absolute;
  left:-26px;
  right:-26px;
  top:24px;
  height:2px;
  background:#4fd1c5;
  box-shadow:0 0 18px rgba(79,209,197,.85);
}
.parcel-box{
  position:absolute;
  width:64px;
  height:40px;
  border-radius:12px;
  background:
    linear-gradient(135deg,rgba(236,253,245,.24),rgba(45,212,191,.07)),
    rgba(7,18,29,.82);
  border:1px solid rgba(125,211,252,.28);
  box-shadow:0 18px 30px rgba(0,0,0,.26),0 0 24px rgba(45,212,191,.20),inset 0 1px 0 rgba(255,255,255,.12);
  transform-style:preserve-3d;
  animation:parcel-fall 6.2s cubic-bezier(.45,0,.2,1) infinite;
}
.parcel-box::before{
  content:'';
  position:absolute;
  left:10px;
  right:10px;
  top:10px;
  height:6px;
  border-radius:999px;
  background:linear-gradient(90deg,#67e8f9,#2dd4bf);
  box-shadow:0 11px 0 rgba(148,163,184,.20),0 22px 0 rgba(148,163,184,.12);
  opacity:.90;
}
.parcel-box::after{
  content:'';
  position:absolute;
  right:8px;
  bottom:8px;
  width:10px;
  height:10px;
  border-radius:999px;
  background:#5eead4;
  box-shadow:0 0 12px rgba(94,234,212,.72);
}
.p1{left:20%;animation-delay:-.2s;--lane:25%;--x:4deg;--z:-8deg;}
.p2{left:34%;animation-delay:-1.1s;--lane:35%;--x:-7deg;--z:5deg;width:46px;height:38px;}
.p3{left:48%;animation-delay:-2.2s;--lane:45%;--x:8deg;--z:-2deg;}
.p4{left:62%;animation-delay:-3.1s;--lane:29%;--x:-4deg;--z:9deg;width:62px;height:46px;}
.p5{left:73%;animation-delay:-4.4s;--lane:39%;--x:2deg;--z:-11deg;}
.p6{left:27%;animation-delay:-5.2s;--lane:49%;--x:-9deg;--z:3deg;width:48px;height:36px;}
.p7{left:42%;animation-delay:-.7s;--lane:24%;--x:9deg;--z:7deg;}
.p8{left:55%;animation-delay:-1.8s;--lane:34%;--x:-3deg;--z:-6deg;width:44px;height:34px;}
.p9{left:68%;animation-delay:-2.9s;--lane:44%;--x:6deg;--z:8deg;}
.p10{left:79%;animation-delay:-3.9s;--lane:31%;--x:-8deg;--z:-5deg;width:50px;height:40px;}
.p11{left:17%;animation-delay:-4.8s;--lane:41%;--x:4deg;--z:12deg;}
.p12{left:36%;animation-delay:-5.8s;--lane:51%;--x:-5deg;--z:-9deg;width:58px;height:42px;}
@keyframes parcel-fall{
  0%{top:var(--lane);opacity:0;transform:translate3d(-180px,-38px,70px) rotateX(58deg) rotateY(-14deg) rotateZ(var(--z)) scale(.78);}
  18%{opacity:.92;}
  52%{opacity:1;transform:translate3d(80px,0,38px) rotateX(var(--x)) rotateY(8deg) rotateZ(var(--z)) scale(1);}
  100%{top:var(--lane);opacity:0;transform:translate3d(430px,68px,0) rotateX(var(--x)) rotateY(16deg) rotateZ(var(--z)) scale(.92);}
}

#splash_screen{
  background:
    linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.58)),
    radial-gradient(circle at 18% 16%,rgba(15,118,110,.10),transparent 30%),
    radial-gradient(circle at 78% 72%,rgba(17,50,71,.08),transparent 34%),
    linear-gradient(180deg,var(--surface-2,#f3f7f8),var(--bg,#eef3f5));
  overflow:hidden;
  user-select:none;
}
.splash-skeleton-bg{
  display:none;
}
.sk-nav,.sk-block{
  background:rgba(255,255,255,.10);
}
.splash-radar{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  pointer-events:none;
}
.splash-radar::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  background:
    linear-gradient(90deg,rgba(255,255,255,.28),transparent 20%,transparent 80%,rgba(255,255,255,.28)),
    radial-gradient(circle at 50% 50%,transparent 0 38%,rgba(238,243,245,.28) 72%,rgba(238,243,245,.52) 100%);
}
.splash-radar-grid{
  position:absolute;
  inset:-10%;
  background:
    linear-gradient(rgba(17,50,71,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(17,50,71,.055) 1px,transparent 1px);
  background-size:70px 70px;
  transform:perspective(900px) rotateX(62deg) translateY(16%);
  transform-origin:50% 70%;
  animation:splash-grid-drift 9s linear infinite;
}
.splash-radar-ring{
  position:absolute;
  width:min(72vw,720px);
  aspect-ratio:1;
  border:1px solid rgba(17,50,71,.08);
  border-radius:50%;
  box-shadow:0 0 60px rgba(15,118,110,.04) inset;
}
.splash-radar-ring.ring-b{width:min(50vw,500px);opacity:.55;}
.splash-radar-ring.ring-c{width:min(28vw,280px);opacity:.42;}
.splash-radar-sweep{
  position:absolute;
  width:min(72vw,720px);
  aspect-ratio:1;
  border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 74%,rgba(15,118,110,.10) 84%,transparent 95% 100%);
  animation:splash-sweep 5.8s linear infinite;
  filter:blur(.2px);
}
.splash-radar-ring,
.splash-radar-sweep,
.splash-node,
.splash-route{
  z-index:1;
}
.splash-node{
  position:absolute;
  width:9px;
  height:9px;
  border-radius:999px;
  background:var(--ac,#0f766e);
  box-shadow:0 0 0 6px rgba(15,118,110,.06),0 0 12px rgba(15,118,110,.24);
  animation:splash-node-pulse 2.4s ease-in-out infinite;
}
.splash-node.n1{transform:translate(-260px,-110px);animation-delay:-.2s;}
.splash-node.n2{transform:translate(210px,-150px);animation-delay:-.6s;}
.splash-node.n3{transform:translate(300px,90px);animation-delay:-1.1s;}
.splash-node.n4{transform:translate(-180px,170px);animation-delay:-1.4s;}
.splash-node.n5{transform:translate(20px,220px);animation-delay:-.9s;}
.splash-route{
  position:absolute;
  width:min(920px,86vw);
  height:min(410px,58vh);
  transform:perspective(900px) rotateX(58deg) translateY(12%);
  transform-origin:50% 70%;
  opacity:.72;
}
.route-line{
  position:absolute;
  left:6%;
  right:6%;
  height:16px;
  border-radius:999px;
  background:
    linear-gradient(90deg,transparent,rgba(15,118,110,.22),rgba(17,50,71,.10),transparent),
    repeating-linear-gradient(90deg,rgba(15,118,110,.10) 0 34px,rgba(17,50,71,.035) 34px 42px);
  box-shadow:0 0 20px rgba(15,118,110,.05);
}
.route-line.line-a{top:22%;transform:rotate(-2deg);}
.route-line.line-b{top:51%;transform:rotate(7deg);}
.route-line.line-c{top:72%;transform:rotate(-7deg);}
.route-packet{
  position:absolute;
  width:42px;
  height:18px;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.84),rgba(15,118,110,.46),transparent);
  box-shadow:0 0 16px rgba(15,118,110,.20);
  animation:splash-packet-run 3.4s cubic-bezier(.45,0,.2,1) infinite;
}
.route-packet.packet-a{top:20%;left:4%;animation-delay:-.1s;}
.route-packet.packet-b{top:49%;left:4%;animation-delay:-.78s;}
.route-packet.packet-c{top:70%;left:4%;animation-delay:-1.36s;}
@keyframes splash-sweep{to{transform:rotate(360deg);}}
@keyframes splash-node-pulse{0%,100%{opacity:.35;scale:.8}50%{opacity:1;scale:1.12}}
@keyframes splash-grid-drift{to{background-position:70px 70px;}}
@keyframes splash-packet-run{
  0%{transform:translateX(0) scaleX(.55);opacity:0;}
  14%{opacity:1;}
  72%{opacity:1;}
  100%{transform:translateX(72vw) scaleX(1.1);opacity:0;}
}
