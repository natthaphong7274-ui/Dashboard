<style>
:root{
  /* ── Core — New Palette ── */
  --pr:#003F5C;    /* Deep Navy — primary brand */
  --pl:#005F7A;    /* Mid Navy */
  --ac:#009B9B;    /* Teal — accent / links */
  --bg:#F0F4F5;    /* Light grey-teal page bg */
  --cd:#fff;       /* Card bg */
  --tx:#1a2e35;    /* Main text */
  --t2:#5a7280;    /* Muted text */
  --bd:#CDD8D8;    /* Border — grey-teal */
  /* ── Status ── */
  --rd:#dc2626;    /* Red — negative/loss */
  --gn:#16a34a;    /* Green — positive */
  --or:#E8622A;    /* Orange — accent/warning */
  /* ── Metric colors ── */
  --c-rev:#003F5C;    /* Revenue — deep navy */
  --c-vol:#009B9B;    /* Volume — teal */
  --c-avg:#005F7A;    /* Avg Rev — mid navy */
  --c-ard:#E8622A;    /* Avg Rev/วัน — orange */
  --c-avd:#007A7A;    /* Avg Vol/วัน — dark teal */
  --c-apc:#5C3D8F;    /* Avg/ชิ้น — purple */
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:13px;}
.nav{background:linear-gradient(135deg,var(--pr),var(--pl));padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(30,58,95,.4);position:sticky;top:0;z-index:300;}
.nav-brand{color:white;font-size:15px;font-weight:800;}
.nav-tabs{display:flex;gap:4px;background:rgba(255,255,255,.12);padding:4px;border-radius:10px;}
.ntab{border:none;color:rgba(255,255,255,.8);padding:6px 14px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;background:transparent;transition:.2s;}
.ntab.active{background:white;color:var(--pr);}
.nav-r{display:flex;align-items:center;gap:10px;}
.rbtn{background:var(--ac);border:none;color:white;padding:6px 13px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;}
.lupd{color:rgba(255,255,255,.5);font-size:11px;}
.main{padding:14px 16px;max-width:1600px;margin:0 auto;}
.fpanel{background:var(--cd);border-radius:14px;padding:12px 16px;margin-bottom:10px;box-shadow:0 1px 8px rgba(0,0,0,.07);border:1px solid var(--bd);}
.fph{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.fph h3{font-size:13px;font-weight:700;color:var(--pr);}
.badge{background:var(--ac);color:white;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;}
.agent-srch-wrap{display:flex;flex-direction:column;gap:3px;min-width:200px;flex:1;max-width:260px;position:relative;}
.agent-srch-wrap label{font-size:10px;color:var(--t2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.agent-srch-input{padding:6px 9px;border:1.5px solid var(--bd);border-radius:8px;font-size:12px;background:#f8fafc;outline:none;transition:.2s;width:100%;}
.agent-srch-input:focus{border-color:var(--ac);background:white;}
.ac-dropdown{position:absolute;top:calc(100% + 3px);left:0;right:0;background:white;border:1.5px solid var(--ac);border-radius:10px;z-index:500;max-height:220px;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,.14);display:none;}
.ac-dropdown.open{display:block;}
.ac-item{padding:7px 11px;cursor:pointer;font-size:12px;border-bottom:1px solid #f0f4f8;display:flex;flex-direction:column;gap:1px;}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover{background:#f0f9ff;}
.ac-item strong{color:var(--pr);font-weight:700;}
.ac-item span{color:var(--t2);font-size:10px;}
.ac-item mark{background:#fef9c3;color:#92400e;border-radius:2px;padding:0 2px;}
.ms-wrap{display:flex;flex-direction:column;gap:3px;min-width:120px;flex:1;max-width:190px;position:relative;}
.ms-wrap label{font-size:10px;color:var(--t2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.ms-trigger{padding:6px 9px;border:1.5px solid var(--bd);border-radius:8px;font-size:12px;background:#f8fafc;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;}
.ms-trigger.open{border-color:var(--ac);background:white;}
.ms-trigger-text{overflow:hidden;text-overflow:ellipsis;flex:1;white-space:nowrap;}
.ms-dropdown{position:absolute;top:calc(100% + 3px);left:0;right:0;background:white;border:1.5px solid var(--ac);border-radius:10px;z-index:400;max-height:210px;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.12);display:none;}
.ms-dropdown.open{display:block;}
.ms-search{padding:6px 9px;border:none;border-bottom:1px solid var(--bd);width:100%;font-size:12px;outline:none;}
.ms-opt{display:flex;align-items:center;gap:7px;padding:6px 9px;cursor:pointer;font-size:12px;}
.ms-opt:hover{background:#f0f9ff;}
.ms-opt input[type=checkbox]{accent-color:var(--ac);width:13px;height:13px;}
.ms-opt.all-opt{border-bottom:1px solid var(--bd);font-weight:700;color:var(--pr);}
.ms-tag{display:inline-block;background:#e0f7ff;color:#0077a8;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700;margin:1px;}
.factions{display:flex;gap:6px;align-items:flex-end;padding-top:16px;}
.btnf{padding:7px 14px;background:var(--pr);color:white;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;}
.btnc{padding:7px 10px;background:#f1f5f9;color:var(--t2);border:1.5px solid var(--bd);border-radius:8px;cursor:pointer;font-size:12px;}
.ms-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:350;display:none;}
.ms-overlay.on{display:block;}
.month-bar{background:var(--cd);border-radius:14px;padding:10px 16px;margin-bottom:10px;box-shadow:0 1px 8px rgba(0,0,0,.07);border:1px solid var(--bd);display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.month-bar-label{font-size:12px;font-weight:700;color:var(--pr);white-space:nowrap;}
.month-select{padding:7px 12px;border:2px solid var(--bd);border-radius:10px;background:white;cursor:pointer;font-size:12px;font-weight:700;color:var(--pr);outline:none;min-width:160px;}
.month-select:focus{border-color:var(--ac);}
.month-hint{font-size:11px;color:var(--t2);padding:4px 10px;background:#f8fafc;border-radius:8px;border:1px solid var(--bd);}
/* day badge */
.day-badge{font-size:11px;color:white;background:var(--pr);padding:3px 10px;border-radius:20px;font-weight:700;}
.stabs{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;}
.stab{padding:6px 12px;border:1.5px solid var(--bd);border-radius:8px;background:white;cursor:pointer;font-size:11px;font-weight:700;color:var(--t2);transition:.2s;}
.stab.active{background:var(--pr);color:white;border-color:var(--pr);}
.stab:hover:not(.active){border-color:var(--ac);color:var(--ac);}
.stab.cmp-tab.active{background:linear-gradient(135deg,var(--pr),var(--ac));border-color:transparent;}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-bottom:12px;}
.kcard{background:var(--cd);border-radius:12px;padding:12px 14px;box-shadow:0 1px 6px rgba(0,0,0,.07);border:1px solid var(--bd);position:relative;overflow:hidden;}
.kcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kc,var(--ac));}
.kico{position:absolute;right:10px;top:10px;font-size:17px;opacity:.12;}
.klbl{font-size:10px;color:var(--t2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.kval{font-size:19px;font-weight:800;color:var(--kc,var(--pr));line-height:1;margin-bottom:2px;}
.ksub{font-size:10px;color:var(--t2);}
.ktrend{font-size:11px;font-weight:700;margin-top:3px;}
.kcard-trend{min-height:168px;display:flex;flex-direction:column;}
.kcard-trend .ksub{min-height:24px;line-height:1.25;}
.kmini-chart{height:42px;margin-top:auto;padding-top:6px;}
.kmini-chart canvas{width:100%!important;height:100%!important;}
.kcard-mini.kcard-trend{min-height:148px;}
.tup{color:var(--gn);}.tdn{color:var(--rd);}
.spanel{display:none;}.spanel.active{display:block;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;}
.gfull{margin-bottom:10px;}
.ccard{background:var(--cd);border-radius:12px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.07);border:1px solid var(--bd);}
.chdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.ctitle{font-size:12px;font-weight:700;color:var(--pr);}
.csub{font-size:10px;color:var(--t2);margin-top:2px;}
.cbadge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:#f0f9ff;color:var(--ac);border:1px solid #bae6fd;}
.cbadge-red{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:#fff0f0;color:var(--rd);border:1px solid #fca5a5;}
.ch160{height:160px;}.ch180{height:180px;}.ch200{height:200px;}.ch220{height:220px;}.ch260{height:260px;}.ch300{height:300px;}.ch340{height:340px;}.ch380{height:380px;}.ch400{height:400px;}
.drill-panel{background:#f0f8ff;border:1.5px solid var(--ac);border-radius:10px;padding:11px 13px;margin-top:9px;display:none;}
.drill-panel.open{display:block;}
.drill-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.drill-title{font-size:11px;font-weight:700;color:var(--pr);}
.drill-close{cursor:pointer;color:var(--t2);font-size:13px;padding:0 4px;}
.drill-close:hover{color:var(--rd);}
.lsb{border-radius:10px;padding:11px 12px;text-align:center;}
.lsb-total{background:#f0f4ff;border:1.5px solid #c7d2fe;}
.lsb-diff{background:#f0fdf4;border:1.5px solid #bbf7d0;}
.lsb-num{font-size:20px;font-weight:800;line-height:1;margin-bottom:3px;}
.lsb-lbl{font-size:11px;color:var(--t2);font-weight:600;}
.sbadge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;}
.sb-other{background:#f1f5f9;color:var(--t2);}
.cmp-header{background:linear-gradient(135deg,#0f2744,#1e3a5f);border-radius:14px;padding:16px 20px;margin-bottom:12px;color:white;}
.cmp-title{font-size:15px;font-weight:800;}
.cmp-sub{font-size:11px;opacity:.65;margin-top:2px;}
.cmp-mode-bar{background:var(--cd);border-radius:12px;padding:12px 16px;margin-bottom:12px;border:1px solid var(--bd);box-shadow:0 1px 6px rgba(0,0,0,.07);}
.cmp-mode-title{font-size:11px;font-weight:700;color:var(--t2);margin-bottom:8px;text-transform:uppercase;}
.mode-btns{display:flex;gap:6px;margin-bottom:10px;}
.mode-btn{padding:7px 16px;border:2px solid var(--bd);border-radius:9px;background:white;cursor:pointer;font-size:12px;font-weight:700;color:var(--t2);transition:.2s;}
.mode-btn.active{background:var(--pr);color:white;border-color:var(--pr);}
.cmp-picker{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.cmp-picker label{font-size:11px;font-weight:700;color:var(--t2);}
.cmp-sel{padding:6px 10px;border:2px solid var(--bd);border-radius:8px;font-size:12px;font-weight:700;outline:none;cursor:pointer;background:white;}
.cmp-sel.sel-a{border-color:#00b4d8;color:#0077a8;}
.cmp-sel.sel-b{border-color:#f72585;color:#b5006b;}
.cmp-run-btn{padding:7px 16px;background:var(--pr);color:white;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;}
.multi-month-wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.m-chk-label{display:flex;align-items:center;gap:5px;padding:5px 10px;border:2px solid var(--bd);border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;color:var(--t2);transition:.2s;background:white;}
.m-chk-label.checked{color:white;}
.m-chk-label input{display:none;}
.cmp-kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:14px;}
.cmp-kcard{background:var(--cd);border-radius:13px;padding:14px;box-shadow:0 1px 7px rgba(0,0,0,.08);border:1px solid var(--bd);position:relative;overflow:hidden;}
.cmp-kcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kc,var(--ac));}
.cmp-klbl{font-size:10px;color:var(--t2);font-weight:700;text-transform:uppercase;margin-bottom:8px;}
.cmp-krow{display:flex;gap:8px;align-items:center;}
.cmp-kitem{flex:1;text-align:center;padding:7px 6px;border-radius:8px;}
.cmp-knum{font-size:16px;font-weight:800;line-height:1;}
.cmp-ksubt{font-size:10px;color:var(--t2);margin-top:2px;}
.pct-pill{display:inline-block;padding:2px 6px;border-radius:20px;font-size:10px;font-weight:800;}
.pct-up{background:#dcfce7;color:#15803d;}
.pct-dn{background:#fee2e2;color:var(--rd);}
.pct-zero{background:#f1f5f9;color:#64748b;}
.cmp-section{background:var(--cd);border-radius:13px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.07);border:1px solid var(--bd);margin-bottom:12px;}
.cmp-section-title{font-size:12px;font-weight:700;color:var(--pr);margin-bottom:11px;}
.tsec{background:var(--cd);border-radius:14px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.07);border:1px solid var(--bd);}
.tbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:7px;}
.tbar h2{font-size:13px;font-weight:700;color:var(--pr);}
.ttools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.tsrch{padding:6px 11px;border:1.5px solid var(--bd);border-radius:8px;font-size:12px;width:200px;outline:none;}
.tsrch:focus{border-color:var(--ac);}
.tsrch-phone{padding:6px 11px;border:1.5px solid var(--bd);border-radius:8px;font-size:12px;width:140px;outline:none;}
.tsrch-phone:focus{border-color:var(--ac);}
.tmonth-sel{padding:6px 10px;border:2px solid var(--bd);border-radius:8px;font-size:12px;font-weight:700;color:var(--pr);background:white;outline:none;cursor:pointer;min-width:130px;}
.tmonth-sel:focus{border-color:var(--ac);}
.btnexp{padding:6px 12px;background:var(--gn);color:white;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;}
.twrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead tr{background:#f0f4ff;}
th{padding:8px 10px;text-align:left;font-weight:700;color:var(--pr);cursor:pointer;white-space:nowrap;user-select:none;border-bottom:2px solid var(--bd);}
th:hover{background:#dde6ff;}
td{padding:7px 10px;border-bottom:1px solid #f0f4f8;white-space:nowrap;}
tr:hover td{background:#f8faff;}
.tdr{text-align:right;}
.tdneg{color:var(--rd);font-weight:600;}
.tdpos{color:var(--gn);font-weight:600;}
.mt{width:100%;border-collapse:collapse;font-size:12px;}
.mt th{padding:7px 9px;background:#f0f4ff;color:var(--pr);font-weight:700;text-align:left;border-bottom:2px solid var(--bd);}
.mt td{padding:6px 9px;border-bottom:1px solid #f0f4f8;}
.mt tr:hover td{background:#f8faff;}
.pgn{display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:7px;}
.pginfo{font-size:11px;color:var(--t2);}
.pgbtns{display:flex;gap:3px;}
.pgbtn{padding:4px 8px;border:1.5px solid var(--bd);border-radius:6px;background:white;cursor:pointer;font-size:11px;font-weight:600;color:var(--t2);}
.pgbtn.active{background:var(--pr);color:white;border-color:var(--pr);}
.pgbtn:disabled{opacity:.35;cursor:default;}
.rn{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;font-size:10px;font-weight:800;}
.r1{background:#ffd700;color:#7a5800;}.r2{background:#c0c0c0;color:#4a4a4a;}.r3{background:#cd7f32;color:white;}.ro{background:#e2e8f0;color:var(--t2);}
/* ── Tracking System ── */
.trk-status{padding:4px 6px;border:1.5px solid var(--bd);border-radius:7px;font-size:11px;background:#f8fafc;cursor:pointer;min-width:130px;outline:none;transition:.2s;}
.trk-status:focus{border-color:var(--ac);background:white;}
.trk-status.s-wait{border-color:#94a3b8;background:#f8fafc;}
.trk-status.s-contact{border-color:#3b82f6;background:#eff6ff;color:#1d4ed8;}
.trk-status.s-solving{border-color:#f59e0b;background:#fffbeb;color:#92400e;}
.trk-status.s-success{border-color:#16a34a;background:#f0fdf4;color:#166534;}
.trk-status.s-fail{border-color:#dc2626;background:#fff0f0;color:#991b1b;}
/* Growth-specific status colours */
.trk-status.gs-wait{border-color:#94a3b8;background:#f8fafc;}
.trk-status.gs-contacted{border-color:#3b82f6;background:#eff6ff;color:#1d4ed8;}
.trk-status.gs-data_collected{border-color:#7c3aed;background:#f5f3ff;color:#5b21b6;}
.trk-status.gs-rewarded{border-color:#d97706;background:#fffbeb;color:#92400e;}
.trk-status.gs-upsold{border-color:#16a34a;background:#f0fdf4;color:#166534;}
.trk-status.gs-unreachable{border-color:#9ca3af;background:#f3f4f6;color:#6b7280;}
/* Growth reason (key_success) dropdown */
.growth-reason{padding:4px 6px;border:1.5px solid #86efac;border-radius:7px;font-size:11px;background:#f0fdf4;color:#166534;cursor:pointer;min-width:160px;outline:none;}
.growth-reason:focus{border-color:#16a34a;}
.trk-reason{padding:4px 6px;border:1.5px solid #fca5a5;border-radius:7px;font-size:11px;background:#fff0f0;cursor:pointer;min-width:130px;outline:none;}
.trk-reason:focus{border-color:#dc2626;}
.trk-note{padding:4px 7px;border:1.5px solid var(--bd);border-radius:7px;font-size:11px;background:#f8fafc;width:150px;outline:none;transition:.2s;}
.trk-note:focus{border-color:var(--ac);background:white;}
.trk-saved{font-size:10px;color:var(--gn);font-weight:700;opacity:0;transition:opacity .4s;}
.trk-saved.show{opacity:1;}
.trk-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border:1.5px solid #86efac;border-radius:10px;margin-bottom:10px;flex-wrap:wrap;}
.trk-bar-label{font-size:12px;font-weight:700;color:#166534;}
.trk-save-all-btn{padding:6px 14px;background:linear-gradient(135deg,#16a34a,#15803d);color:white;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(22,163,74,.3);transition:.2s;}
.trk-save-all-btn:hover{opacity:.88;}
.trk-saved-all{font-size:11px;color:#166534;font-weight:700;display:none;}
.trk-tag-wait{background:#f1f5f9;color:#64748b;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:700;}
.trk-tag-contact{background:#dbeafe;color:#1d4ed8;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:700;}
.trk-tag-solving{background:#fef3c7;color:#92400e;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:700;}
.trk-tag-success{background:#dcfce7;color:#166534;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:700;}
.trk-tag-fail{background:#fee2e2;color:#991b1b;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:700;}
.pb{height:4px;border-radius:3px;background:#e2e8f0;margin-top:3px;}
.pf{height:100%;border-radius:3px;}
/* ── Tracking Summary Modal ── */
.tsm-overlay{position:fixed;inset:0;background:rgba(0,30,50,.55);z-index:900;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
.tsm-overlay.open{display:flex;}
.tsm-modal{background:#fff;border-radius:18px;width:92%;max-width:1100px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.tsm-head{background:linear-gradient(135deg,#003F5C,#005F7A);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.tsm-title{color:white;font-size:15px;font-weight:800;}
.tsm-sub{color:rgba(255,255,255,.6);font-size:11px;margin-top:2px;}
.tsm-close{background:rgba(255,255,255,.15);border:none;color:white;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.tsm-close:hover{background:rgba(255,255,255,.28);}
.tsm-body{overflow-y:auto;padding:18px 22px;flex:1;}
.tsm-tabs{display:flex;gap:6px;margin-bottom:16px;}
.tsm-tab{padding:7px 18px;border:2px solid var(--bd);border-radius:9px;background:white;cursor:pointer;font-size:12px;font-weight:700;color:var(--t2);transition:.2s;}
.tsm-tab.active{background:var(--pr);color:white;border-color:var(--pr);}
.tsm-krow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px;}
.tsm-kc{border-radius:12px;padding:12px 14px;text-align:center;border:1.5px solid;}
.tsm-kc-total{background:#f0f4ff;border-color:#c7d2fe;}
.tsm-kc-none{background:#f1f5f9;border-color:#cbd5e1;}
.tsm-kc-contact{background:#eff6ff;border-color:#93c5fd;}
.tsm-kc-solving{background:#fffbeb;border-color:#fcd34d;}
.tsm-kc-success{background:#f0fdf4;border-color:#86efac;}
.tsm-kc-fail{background:#fff0f0;border-color:#fca5a5;}
.tsm-knum{font-size:22px;font-weight:800;line-height:1;}
.tsm-klbl{font-size:10px;font-weight:700;margin-top:3px;color:var(--t2);}
.tsm-section{background:#f8fafc;border-radius:12px;padding:14px;margin-bottom:14px;border:1px solid var(--bd);}
.tsm-sec-title{font-size:12px;font-weight:700;color:var(--pr);margin-bottom:12px;}
.tsm-chart-wrap{height:220px;position:relative;}
.tsm-zone-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px;}
.tsm-zone-table th{padding:6px 10px;background:#f0f4ff;color:var(--pr);font-weight:700;text-align:left;border-bottom:2px solid var(--bd);}
.tsm-zone-table td{padding:6px 10px;border-bottom:1px solid #f0f4f8;}
.tsm-zone-table tr:hover td{background:#f8faff;}
.tsm-pbar-wrap{display:flex;align-items:center;gap:6px;}
.tsm-pbar-bg{flex:1;height:6px;border-radius:4px;background:#e2e8f0;overflow:hidden;}
.tsm-pbar-fill{height:100%;border-radius:4px;}
.tsm-btn{padding:6px 14px;background:linear-gradient(135deg,#003F5C,#005F7A);color:white;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;}
.tsm-btn:hover{opacity:.88;}
.rc-report-btn{background:linear-gradient(135deg,#003F5C,#005F7A);}
.rc-overlay{position:fixed;inset:0;background:rgba(0,30,50,.58);z-index:910;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
.rc-overlay.open{display:flex;}
.rc-modal{background:#fff;border-radius:18px;width:min(1180px,94%);max-height:92vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(15,23,42,.28);}
.rc-head{background:linear-gradient(135deg,#003F5C,#005F7A);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;}
.rc-title{color:#fff;font-size:15px;font-weight:800;}
.rc-sub{color:rgba(255,255,255,.72);font-size:11px;margin-top:3px;}
.rc-close{background:rgba(255,255,255,.14);border:none;color:#fff;width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.rc-close:hover{background:rgba(255,255,255,.24);}
.rc-body{padding:18px 22px 22px;overflow-y:auto;flex:1;background:#f8fafc;}
.rc-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.rc-tab{padding:8px 16px;border:1.5px solid var(--bd);background:#fff;color:var(--t2);border-radius:10px;cursor:pointer;font-size:12px;font-weight:800;transition:.18s;}
.rc-tab.active{background:var(--pr);color:#fff;border-color:var(--pr);}
.rc-panel{display:none;}
.rc-panel.active{display:block;}
.rc-krow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px;}
.rc-kpi{background:#fff;border:1px solid #dbe4ee;border-radius:14px;padding:14px 15px;box-shadow:0 1px 5px rgba(15,23,42,.05);}
.rc-kpi-label{font-size:11px;font-weight:800;color:var(--t2);text-transform:uppercase;letter-spacing:.02em;}
.rc-kpi-value{font-size:26px;font-weight:900;color:var(--pr);margin-top:6px;line-height:1;}
.rc-kpi-sub{font-size:11px;color:var(--t2);margin-top:7px;line-height:1.5;}
.rc-kpi-trend{margin-top:8px;font-size:11px;font-weight:800;}
.rc-kpi-trend.up{color:#166534;}
.rc-kpi-trend.down{color:#dc2626;}
.rc-kpi-trend.flat{color:#64748b;}
.rc-grid{display:grid;gap:12px;margin-bottom:14px;}
.rc-grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}
.rc-card{background:#fff;border:1px solid #dbe4ee;border-radius:14px;padding:14px 15px;box-shadow:0 1px 5px rgba(15,23,42,.05);}
.rc-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px;}
.rc-card-title{font-size:13px;font-weight:800;color:var(--pr);}
.rc-card-sub{font-size:11px;color:var(--t2);margin-top:3px;line-height:1.5;}
.rc-view-switch{display:inline-flex;align-items:center;gap:4px;padding:4px;background:#eef2f7;border:1px solid #dbe4ee;border-radius:11px;flex-shrink:0;}
.rc-view-btn{border:none;background:transparent;color:var(--t2);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:800;transition:.18s;}
.rc-view-btn.active{background:#fff;color:var(--pr);box-shadow:0 1px 4px rgba(15,23,42,.08);}
.rc-chart-wrap{height:250px;position:relative;}
.rc-table{width:100%;border-collapse:collapse;font-size:11px;}
.rc-table th{padding:8px 9px;border-bottom:2px solid #dbe4ee;background:#f8fbff;color:var(--pr);font-weight:800;text-align:left;}
.rc-table td{padding:8px 9px;border-bottom:1px solid #edf2f7;color:#0f172a;vertical-align:top;}
.rc-table tr:last-child td{border-bottom:none;}
.rc-table tr:hover td{background:#f8fafc;}
.rc-rank{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:999px;background:#e0f2fe;color:#0369a1;font-size:11px;font-weight:900;}
.rc-matrix-wrap{overflow:auto;border:1px solid #dbe4ee;border-radius:12px;}
.rc-matrix-table{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;background:#fff;min-width:860px;}
.rc-matrix-table th{padding:9px 10px;background:#f8fbff;color:var(--pr);font-weight:800;text-align:left;border-bottom:2px solid #dbe4ee;white-space:nowrap;position:sticky;top:0;z-index:1;}
.rc-matrix-table td{padding:9px 10px;border-bottom:1px solid #edf2f7;vertical-align:top;white-space:nowrap;}
.rc-matrix-table tr:last-child td{border-bottom:none;}
.rc-matrix-table tr:hover td{background:#f8fafc;}
.rc-matrix-sticky{position:sticky;left:0;background:inherit;z-index:1;}
.rc-matrix-sticky-2{position:sticky;left:110px;background:inherit;z-index:1;}
.rc-matrix-head-sticky{z-index:3;background:#f8fbff !important;}
.rc-pair{display:grid;gap:2px;line-height:1.35;}
.rc-pair-main{font-weight:800;color:#0f172a;}
.rc-pair-sub{color:var(--t2);}
.rc-month-head{display:grid;gap:2px;}
.rc-month-sub{font-size:10px;color:var(--t2);font-weight:700;}
.rc-note-list{display:grid;gap:10px;}
.rc-note{border:1px solid #dbe4ee;border-radius:12px;padding:12px;background:#f8fafc;}
.rc-note-title{font-size:12px;font-weight:800;color:#111827;}
.rc-note-text{font-size:12px;color:#475569;line-height:1.6;margin-top:4px;}
.rc-badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;}
.rc-badge.up{background:#dcfce7;color:#166534;}
.rc-badge.down{background:#fee2e2;color:#b91c1c;}
.rc-badge.flat{background:#e2e8f0;color:#475569;}
.rc-export-list{display:grid;gap:10px;}
.rc-export-btn{padding:11px 14px;border:none;border-radius:12px;background:linear-gradient(135deg,#003F5C,#005F7A);color:#fff;font-size:13px;font-weight:800;cursor:pointer;text-align:left;box-shadow:0 10px 24px rgba(0,63,92,.18);}
.rc-export-btn:hover{opacity:.9;}
.rc-meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.rc-meta-item{border:1px solid #dbe4ee;border-radius:12px;padding:11px 12px;background:#f8fafc;}
.rc-meta-label{font-size:10px;font-weight:800;color:var(--t2);text-transform:uppercase;}
.rc-meta-value{font-size:12px;font-weight:700;color:#111827;margin-top:5px;word-break:break-word;}
.rc-empty{padding:26px 18px;text-align:center;color:var(--t2);font-size:12px;}
.rc-meter{display:flex;align-items:center;gap:8px;}
.rc-meter-bar{flex:1;height:7px;background:#e2e8f0;border-radius:999px;overflow:hidden;}
.rc-meter-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#0ea5e9,#003F5C);}
.rc-meter-val{font-size:10px;font-weight:800;color:var(--t2);min-width:40px;text-align:right;}
.sdiv{display:flex;align-items:center;gap:8px;margin:11px 0 9px;}
.sdiv h3{font-size:12px;font-weight:700;color:var(--pr);white-space:nowrap;}
.sdiv::after{content:'';flex:1;height:1px;background:var(--bd);}
/* New: mini stat row inside KPI overview */
.kpi-extra-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-bottom:12px;}
.kcard-mini{background:linear-gradient(135deg,#f0f9ff,#e0f7fe);border-radius:12px;padding:10px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid #bae6fd;position:relative;overflow:hidden;}
.kcard-mini::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kc,var(--ac));}
.loading{text-align:center;padding:36px;color:var(--t2);}
.ui-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:120px;padding:28px 18px;text-align:center;color:var(--t2);}
.ui-state-card{background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.ui-state-title{font-size:13px;font-weight:800;color:var(--pr);}
.ui-state-msg{font-size:12px;line-height:1.55;max-width:560px;}
.ui-state-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e0f7ff;color:var(--ac);font-weight:900;}
.ui-state.empty .ui-state-icon{background:#f8fafc;color:var(--t2);}
.ui-state.error .ui-state-icon{background:#fff0f0;color:var(--rd);}
.ui-state.error .ui-state-title{color:var(--rd);}
@media(max-width:980px){.rc-krow,.rc-grid-2,.rc-meta-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:720px){.rc-body{padding:16px}.rc-krow,.rc-grid-2,.rc-meta-grid{grid-template-columns:1fr}.rc-modal{width:96%;max-height:94vh}.rc-chart-wrap{height:220px}.rc-card-head{flex-direction:column}.rc-view-switch{align-self:flex-start}}
.ui-state.warning .ui-state-icon{background:#fff7ed;color:var(--or);}
.ui-state.warning .ui-state-title{color:#9a3412;}
.ui-state-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:2px;}
.ui-retry-btn{padding:7px 14px;background:var(--pr);color:white;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:800;}
.ui-retry-btn:hover{opacity:.9;}
.dashboard-watermark{display:none;position:fixed;right:14px;bottom:12px;z-index:260;max-width:min(360px,calc(100vw - 28px));padding:7px 10px;border:1px solid rgba(0,63,92,.16);border-radius:10px;background:rgba(255,255,255,.72);box-shadow:0 8px 24px rgba(15,23,42,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:rgba(0,63,92,.58);font-size:10px;font-weight:700;line-height:1.45;pointer-events:none;text-align:right;}
.dashboard-watermark.on{display:block;}
.dashboard-watermark strong{color:rgba(0,63,92,.72);font-weight:900;}
.dashboard-capture-watermark{display:none;position:fixed;inset:-14vh -12vw;z-index:255;pointer-events:none;overflow:hidden;user-select:none;mix-blend-mode:multiply;}
.dashboard-capture-watermark.on{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));grid-auto-rows:minmax(150px,1fr);align-items:center;justify-items:center;}
.dashboard-capture-watermark span{display:block;min-width:250px;color:rgba(0,63,92,.105);font-size:9px;font-weight:900;line-height:1.5;text-align:center;letter-spacing:.04em;text-transform:uppercase;transform:rotate(-24deg);white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.22);}
@media(max-width:900px){.dashboard-capture-watermark.on{grid-template-columns:repeat(3,minmax(210px,1fr));grid-auto-rows:minmax(140px,1fr);}.dashboard-capture-watermark span{min-width:200px;font-size:8px;color:rgba(0,63,92,.12);}}
.action-center-row select{min-width:0;}
@media(max-width:900px){.action-center-row{grid-template-columns:34px 1fr!important;}.action-center-row>div:nth-child(n+3){grid-column:2;}}
.spin{width:30px;height:30px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 10px;}
@keyframes sp{to{transform:rotate(360deg);}}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr;}.kgrid,.kpi-extra-row,.cmp-kgrid{grid-template-columns:repeat(2,1fr);}.loss-sumbox{grid-template-columns:1fr 1fr;}.kcard-loss{grid-column:span 1;}}
/* ===== MAP SECTION — redesigned ===== */
/* 5-level status colours */
:root{
  --ms-very-bad:#b91c1c; --msf-very-bad:rgba(185,28,28,.2);
  --ms-bad:#ea580c;      --msf-bad:rgba(234,88,12,.18);
  --ms-normal:#64748b;   --msf-normal:rgba(100,116,139,.14);
  --ms-good:#16a34a;     --msf-good:rgba(22,163,74,.18);
  --ms-great:#0d9488;    --msf-great:rgba(13,148,136,.22);
}
#map_container{width:100%;height:520px;border-radius:12px;overflow:clip;border:1px solid var(--bd);box-shadow:0 2px 8px rgba(0,0,0,.08);position:relative;}
/* ── Legend (new) ── */
.map-legend{
  position:absolute;bottom:12px;left:12px;z-index:1000;
  display:flex;flex-direction:column;
  padding:10px 13px 12px;
  background:rgba(6,9,20,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:14px;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 8px 32px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.04);
  pointer-events:auto;
  min-width:210px;max-width:250px;
  max-height:calc(100% - 24px);
  overflow:hidden;
  transition:all .25s ease;
}
.map-legend-compact{min-width:168px;max-width:210px;padding:8px 10px 9px;bottom:16px;left:16px;}
.map-legend-compact .map-legend-header{margin-bottom:4px;}
.map-legend-compact .map-legend-title{font-size:8.5px;letter-spacing:.9px;}
.map-legend-compact .map-legend-item{font-size:10px;gap:6px;}
.map-legend-note{font-size:9px;color:rgba(255,255,255,.46);line-height:1.35;padding:2px 4px 0;}
.map-legend-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;gap:8px;margin-bottom:6px;flex-shrink:0;}
.map-legend-title{font-size:9px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:rgba(255,255,255,.45);}
.map-legend-toggle{width:18px;height:18px;border-radius:5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);font-size:10px;line-height:1;transition:all .2s;flex-shrink:0;}
.map-legend-toggle:hover{background:rgba(255,255,255,.2);}
.map-legend-body{display:flex;flex-direction:column;gap:3px;overflow-y:auto;overflow-x:hidden;transition:max-height .25s ease,opacity .2s ease;scrollbar-width:none;}
.map-legend-body::-webkit-scrollbar{display:none;}
.map-legend-body.collapsed{max-height:0!important;opacity:0;pointer-events:none;margin-top:-4px;}
.map-legend-item{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:rgba(255,255,255,.88);}
.map-legend-dot{width:13px;height:13px;border-radius:3px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.4);}
.map-legend-range{font-size:10px;color:rgba(255,255,255,.38);margin-left:auto;font-family:monospace;}
.map-legend-divider{height:1px;background:rgba(255,255,255,.1);margin:5px 0 3px;}
.map-legend-sub-title{font-size:9px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:rgba(255,255,255,.38);margin-bottom:3px;}
.map-legend-zone-row{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
.map-legend-zone-line{height:3px;width:22px;border-radius:2px;flex-shrink:0;}
.map-legend-zone-label{font-size:10px;color:rgba(255,255,255,.65);}
.map-zone-list{display:grid;grid-template-columns:1fr 1fr;gap:4px 6px;margin-top:5px;max-height:92px;overflow:auto;scrollbar-width:none;}
.map-zone-list::-webkit-scrollbar{display:none;}
.map-zone-chip{display:flex;align-items:center;gap:5px;padding:4px 5px;border-radius:7px;cursor:pointer;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);transition:background .15s,border-color .15s,transform .15s;}
.map-zone-chip:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.22);transform:translateY(-1px);}
.map-zone-line-swatch{width:22px;height:8px;flex-shrink:0;filter:drop-shadow(0 1px 1px rgba(0,0,0,.65));}
.map-zone-chip-name{font-size:10px;font-weight:800;color:rgba(255,255,255,.9);line-height:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.map-zone-chip-count{margin-left:auto;font-size:9px;font-weight:800;color:rgba(255,255,255,.48);}
.map-zone-label{display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:8px;background:rgba(5,8,18,.9);border:1.5px solid var(--zc);box-shadow:0 7px 18px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);pointer-events:none;white-space:nowrap;}
.map-zone-label-callout{min-width:96px;justify-content:flex-start;background:rgba(5,8,18,.94);}
.map-zone-label-left{flex-direction:row;}
.map-zone-label-right{flex-direction:row-reverse;}
.map-zone-label-code{font-size:11px;font-weight:900;line-height:1;color:#fff;background:var(--zc);padding:3px 6px;border-radius:5px;text-shadow:0 1px 2px rgba(0,0,0,.35);}
.map-zone-label-meta{font-size:9px;font-weight:800;line-height:1;color:rgba(255,255,255,.78);}
.map-tip-title{display:flex;align-items:center;gap:7px;margin-bottom:7px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.12);}
.map-tip-province{font-size:13px;font-weight:900;color:#fff;}
.map-tip-zone{font-size:10px;font-weight:900;padding:2px 7px;border-radius:999px;color:#fff;background:var(--zc);}
.map-tip-grid{display:grid;grid-template-columns:auto auto;gap:4px 14px;align-items:baseline;}
.map-tip-key{font-size:10px;color:rgba(255,255,255,.52);}
.map-tip-val{font-size:11px;font-weight:850;color:rgba(255,255,255,.94);text-align:right;}
/* legacy classes kept for compatibility */
.map-legend-summary{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px;}
.map-legend-stat{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
/* ── BD map wrapper ── */
.bd-map-wrap{position:relative;border-radius:10px;overflow:clip;}
.bd-map-legend{
  position:absolute;bottom:8px;left:8px;z-index:1000;
  background:rgba(10,14,26,.88);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);border-radius:10px;
  padding:7px 10px;display:flex;flex-direction:column;gap:4px;
  min-width:150px;
}
.bd-map-leg-row{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600;color:rgba(255,255,255,.8);}
.bd-map-leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.bd-map-leg-divider{height:1px;background:rgba(255,255,255,.1);margin:2px 0;}
.bd-map-leg-zone-row{display:flex;align-items:center;gap:6px;font-size:9px;color:rgba(255,255,255,.55);}
.bd-map-leg-zone-line{height:2px;width:18px;border-radius:2px;flex-shrink:0;border-style:dashed;border-width:1px;background:transparent;}
.bd-map-count{position:absolute;top:8px;right:8px;z-index:1000;background:rgba(10,14,26,.8);color:rgba(255,255,255,.7);font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid rgba(255,255,255,.12);}
/* ── Popup ── */
